name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
  # Lets other workflows (update-document.yml) redeploy after committing.
  # A push made with GITHUB_TOKEN does not start a new workflow run, so the
  # swap workflow calls this one directly instead of relying on its push.
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to build. Defaults to the triggering commit.
        type: string
        required: false
        default: ''

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `inputs` is null unless this run came through workflow_call.
          ref: ${{ inputs.ref || github.sha }}
          # Full history: scripts/document-dates.mjs reads the commit date of
          # the last change to each PDF, which a shallow clone would hide.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Compare each PDF in public/ against its previous committed version and
      # regenerate src/data/documentDates.ts, so the resume/CV viewers show the
      # month and year the document itself last changed. Writes a table to the
      # run summary noting whether anything moved since the last build.
      - name: Refresh document dates
        run: npm run doc-dates
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Ping IndexNow (Bing et al.) with the freshly deployed URLs.
      # Non-fatal: indexing is best-effort and shouldn't fail the deploy.
      - name: Notify IndexNow
        run: node scripts/indexnow.mjs
        continue-on-error: true
